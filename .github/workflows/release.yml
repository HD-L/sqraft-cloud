# 发布：推送 v* 标签时
#   1. 构建 linux/amd64 + linux/arm64 镜像，推到 GitHub Container Registry（ghcr.io/<owner>/sqraft-cloud）
#   2. 在 macOS（Apple Silicon）上打包上传客户端 DMG，连同镜像地址一起发布到 GitHub Release
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sqraft-cloud
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  uploader:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@sqraft-cloud/uploader..."
      - run: pnpm --filter @sqraft-cloud/uploader dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/uploader/release/*.dmg
          body: |
            ## 部署
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/sqraft-cloud:${{ github.ref_name }}
            ```
            详见仓库 docs/deploy.md。

            ## Mac 上传客户端
            下载下方的 DMG（Apple Silicon）。未签名：首次打开需在「系统设置 → 隐私与安全性」里点「仍要打开」。
